name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} ${{ matrix.arch }} with Node.js ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node-version: [20.x, 22.x, 24.x]
        arch: [x64]
        include:
          - os: macos-latest
            node-version: 20.x
            arch: arm64
          - os: macos-latest
            node-version: 22.x
            arch: arm64
          - os: macos-latest
            node-version: 24.x
            arch: arm64
          - os: windows-latest
            node-version: 20.x
            arch: x86
          - os: windows-latest
            node-version: 22.x
            arch: x86

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          architecture: ${{ matrix.arch }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build native tests
        run: npm run build

      - name: Run native tests
        run: npm run test

      - name: Prebuild
        shell: bash
        run: npm run prebuild

      # Consumers resolve node-addon-api from our semver range, not our lockfile,
      # so also build against the newest release to catch header changes early.
      - name: Build and test against latest node-addon-api
        shell: bash
        run: |
          npm install --no-save node-addon-api@latest
          npm run build
          npm run test

  test-mingw:
    name: Test MinGW (MSYS2 UCRT64) on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # MSYS2 no longer builds nodejs for the MINGW64 (msvcrt) environment;
      # UCRT64 is its replacement and uses the same GCC/MinGW-w64 toolchain.
      - name: Set up MSYS2 with UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            make

      - name: Verify MinGW Node.js is active
        shell: msys2 {0}
        run: node -e "const os = require('os'); console.log('os.type():', os.type()); if (!os.type().startsWith('MINGW')) process.exit(1)"

      - name: Remove pinned node-gyp devDependency
        shell: msys2 {0}
        # The pinned node-gyp (added to detect VS2026 for the MSVC-based jobs) gets
        # hoisted into node_modules, which makes node-gyp-build's `require('node-gyp')`
        # resolve locally instead of falling back to PATH. That skips the MSYS2-packaged
        # node-gyp shim, which is the one that knows to build with `-f make` (GCC)
        # instead of MSBuild/MASM, so native builds break under MinGW. Drop it here so
        # this job keeps using the MSYS2 toolchain's own node-gyp.
        #
        # This has to happen before `npm install`, because the `install` lifecycle
        # script (node-gyp-build) already builds the addon. It also leaves package.json
        # out of sync with package-lock.json, so this job must stay on `npm install`
        # rather than `npm ci`.
        run: npm pkg delete devDependencies.node-gyp

      - name: Install dependencies
        shell: msys2 {0}
        run: npm install

      - name: Assert MSYS2 node-gyp is in use
        shell: msys2 {0}
        run: |
          test ! -e node_modules/node-gyp || { echo "local node-gyp shadows the MSYS2 one"; exit 1; }
          # The UCRT64 package only ships node-gyp.cmd in bin/, which bash can't run, and
          # npm's node-gyp-bin shim only resolves correctly when npm sets
          # $npm_config_node_gyp for a lifecycle script. Call npm's node-gyp directly.
          node "$MINGW_PREFIX/lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js" --version

      - name: Build native tests
        shell: msys2 {0}
        run: npm run build

      - name: Run tests
        shell: msys2 {0}
        run: npm test
